<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body class="bg-dark">
    <div class="container">
        <div class="weather__header flex flex-wrap justify-content-center">
            <div class="weather__search">
                <input type="text" placeholder="Search for a city" id="search-ct" class="weather__searchform">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div class="weather__units mx-2">
                <span class="weather_unit_celsius" id="celcius"></span>
            </div>
            <div class="ms-2">
                <button class="btn btn-secondary" id="search">Search</button>
            </div>
        </div>
        <div class="weather__body">
            <h1 class="weather__city" id="name"></h1>
            <!-- <div class="weather__datetime" id="date"></div> -->
            <div class="weather__forecast" id="forecast"></div>
            <div class="weather__icon">
                <img src="" alt="" id="weatherIcon">
            </div>
            <p class="weather__temperature">
            </p>
            <div class="weather__minmax">
                <p>Min: <span id="min">12&#176;</span></p>
                <p>Max: <span id="max">16&#176;</span></p>
            </div>
        </div>

        <div class="weather__info">
            <div class="weather__card">
                <i class="fa-solid fa-temperature-full"></i>
                <div>
                    <p>Real Feel</p>
                    <p class="weather__realfeel" id="realFeel">18&#176;</p>
                </div>
            </div>
            <div class="weather__card">
                <i class="fa-solid fa-droplet"></i>
                <div>
                    <p>Humidity</p>
                    <p class="weather__humidity" id="humidity">18&#176;</p>
                </div>
            </div>
            <div class="weather__card text-white">
                <i class="fa-solid fa-wind"></i>
                <div>
                    <p>Wind</p>
                    <p class="weather__wind" id="wind">18&#176;</p>
                </div>
            </div>
            <div class="weather__card">
                <i class="fa-solid fa-gauge-high"></i>
                <div>
                    <p>Pressure</p>
                    <p class="weather__pressure" id="pressure">18&#176;</p>
                </div>
            </div>
        </div>
    </div>
    <script src="./assets/js/bootstrap.min.js"></script>
    <script src="https://kit.fontawesome.com/a692e1c39f.js"></script>

    <script src="./assets/js/script.js"></script>

</body>

</html>
